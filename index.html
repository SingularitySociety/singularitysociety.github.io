<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singularity Society</title>
    <meta name="description" content="Singularity Society が GitHub で公開しているページの一覧。行動規範・開発の心得、セキュリティ教育など。" />
    <link rel="canonical" href="https://singularitysociety.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Singularity Society" />
    <meta property="og:description" content="Singularity Society が GitHub で公開しているページの一覧。" />
    <meta property="og:url" content="https://singularitysociety.github.io/" />
    <style>
      :root {
        --bg: #f7f7f5;
        --surface: #ffffff;
        --text: #1d1d1f;
        --muted: #5f6368;
        --border: #e2e2de;
        --accent: #2f5bd3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141416;
          --surface: #1e1e21;
          --text: #ececee;
          --muted: #a0a0a8;
          --border: #2e2e33;
          --accent: #8aa8ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 56px 16px 72px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.9rem;
        letter-spacing: 0.01em;
      }
      .lead {
        margin: 0 0 40px;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      a.card {
        display: block;
        padding: 18px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: var(--accent);
      }
      .name {
        display: block;
        font-weight: 600;
        color: var(--accent);
      }
      .desc {
        display: block;
        margin-top: 4px;
        font-size: 0.93rem;
        color: var(--muted);
      }
      footer {
        margin-top: 48px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Singularity Society</h1>
      <p class="lead">テクノロジーで未来を創る実践コミュニティ。GitHub で公開しているページの一覧です。</p>
      <ul>
        <li>
          <a class="card" href="https://singularitysociety.org/">
            <span class="name">公式サイト</span>
            <span class="desc">活動の紹介、技術ブログ、プロジェクト、BootCamp</span>
          </a>
        </li>
        <li>
          <a class="card" href="/societys_statement/">
            <span class="name">行動規範・カルチャー・開発の心得</span>
            <span class="desc">シンギュラリティ・ソサイエティの行動規範、カルチャー、開発の心得をまとめたドキュメント</span>
          </a>
        </li>
        <li>
          <a class="card" href="/security-education/">
            <span class="name">セキュリティ教育</span>
            <span class="desc">詐欺・乗っ取り・情報漏えいから身を守るための、短い動画と確認テスト</span>
          </a>
        </li>
      </ul>
      <footer>
        <a href="https://github.com/SingularitySociety">github.com/SingularitySociety</a>
      </footer>
    </main>
  </body>
</html>
